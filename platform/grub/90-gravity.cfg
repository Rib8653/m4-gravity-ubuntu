# Gravity Linux on Ubuntu: kernel arguments for the M4 Mac mini, as used
# in Gravity's Fedora image (with Fedora's rhgb replaced by Ubuntu's splash).
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX nohlt idle=nop arm64.nowfxt appledrm.hdmi_audio=1"
# You choose an OS with the Mac's own startup disk picker, so skip os-prober.
GRUB_DISABLE_OS_PROBER=true
GRUB_DISABLE_RECOVERY=true
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=3
